[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4-connect-mgr"
version = "0.1.0"
description = "Connection manager for shared remote Elecraft K4 stations (central assignment server + local client CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "cryptography>=42",
    "python-dateutil>=2.9",
    "tzlocal>=5.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.6",
    "ruff>=0.16",
]

[project.scripts]
k4cm = "k4cm.client.main:app"
k4cm-server = "k4cm.server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
# Guard against imports drifting away from the top of a module. Kept on so the
# deliberate post-sys.path imports in tests/conftest.py stay verifiably clean.
extend-select = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer require their markers in argument defaults; B008 would
# otherwise flag every route handler and CLI command.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Argument",
    "typer.Option",
    "k4cm.server.main._data_dir_option",
]
